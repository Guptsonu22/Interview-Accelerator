version: '3.8'

services:
  interview-accelerator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LLM_PROVIDER=demo
      - SQLITE_DB_PATH=/app/data/interview_accelerator.db
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
